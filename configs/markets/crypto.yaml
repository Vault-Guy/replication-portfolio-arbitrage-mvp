market: crypto
raw_archive: data/raw/crypto_data.zip
archive_subdir: crypto_data
canonical_path: data/canonical/crypto_prices.parquet

start: "2020-01-01"
end: "2026-01-01"
frequency: 1H

price_column: close
timestamp_column: datetime
symbol_from_filename: true
symbol_suffix_strip: USDT

adjusted: false
dividends: false
splits: false
allow_partial_histories: true
missing_value_policy: preserve

universe:
  description: "43 top-cap coins"
  expected_count: 43

loader: sarb.data.crypto_loader:load_prices
