# PCA statistical arbitrage defaults aligned with Polish.pdf (Avellaneda-Lee style).
strategy: pca

pca:
  n_components: 15
  variance_target: 0.75
  fit_window: 252
  refit_frequency: 1D
  standardize: true

residuals:
  estimation_window: 120

ou:
  dt_per_year: 252
  min_kappa: 4.0

signals:
  open_long: -1.25
  open_short: 1.25
  close_long: -0.5
  close_short: 0.75
  shift_bars: 1

backtest:
  transaction_cost_bps: 10
  risk_free_rate: 0.015
  leverage: 2.0
  stop_open_bars_before_end: 60
